name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'server.py'
      - 'Dockerfile*'
      - 'requirements*.txt'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi python-multipart httpx
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    # Set repository variable BUILD_RUNNER=blacksmith-4vcpu-ubuntu-2404
    # after enabling Blacksmith, or leave unset for GitHub-hosted runners.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ''
          - dockerfile: Dockerfile.whisper
            suffix: '-whisper'
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase GHCR image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=min,scope=${{ matrix.dockerfile }}
